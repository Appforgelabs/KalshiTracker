<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KalshiTracker — Command Center</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2d;
      --panel-2: #18233d;
      --text: #edf2ff;
      --muted: #99a6c7;
      --border: #263252;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --blue: #60a5fa;
      --purple: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #09101f, #0b1020 200px);
      color: var(--text);
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .hero {
      display: flex; justify-content: space-between; gap: 16px; align-items: end;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 30px; }
    .sub { color: var(--muted); margin-top: 6px; }
    .stamp { color: var(--muted); font-size: 13px; }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .two { grid-template-columns: 1.3fr .7fr; }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel {
      background: rgba(18, 26, 45, 0.96);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }
    .panel h2 { margin: 0 0 14px; font-size: 18px; }
    .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .stat .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .amber { color: var(--amber); }
    .blue { color: var(--blue); }
    .purple { color: var(--purple); }
    .muted { color: var(--muted); }
    .pill {
      display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px;
      border: 1px solid var(--border); background: var(--panel-2); margin-right: 8px; margin-bottom: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    .mini-list { display: grid; gap: 10px; }
    .row { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: rgba(255,255,255,.02); }
    .row-top { display: flex; justify-content: space-between; gap: 12px; }
    .row-title { font-weight: 600; }
    .row-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    ul { margin: 0; padding-left: 18px; }
    canvas { width: 100% !important; height: 280px !important; }
    @media (max-width: 1100px) {
      .stats, .two, .three { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 760px) {
      .stats, .two, .three { grid-template-columns: 1fr; }
      .wrap { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>KalshiTracker</h1>
        <div class="sub">Grok trades. GPT audits. This page keeps score.</div>
      </div>
      <div class="stamp" id="stamp">Loading…</div>
    </div>

    <div class="grid stats" id="stats"></div>

    <div class="grid two" style="margin-top:16px;">
      <div class="panel">
        <h2>Equity Curve</h2>
        <canvas id="equityChart"></canvas>
      </div>
      <div class="panel">
        <h2>Live Config</h2>
        <div id="config"></div>
      </div>
    </div>

    <div class="grid two" style="margin-top:16px;">
      <div class="panel">
        <h2>GPT Strategy Review</h2>
        <div id="gptReview"></div>
      </div>
      <div class="panel">
        <h2>Heuristic Guardrails</h2>
        <div id="heuristic"></div>
      </div>
    </div>

    <div class="grid three" style="margin-top:16px;">
      <div class="panel">
        <h2>By Market Family</h2>
        <div id="families"></div>
      </div>
      <div class="panel">
        <h2>By Model</h2>
        <div id="models"></div>
      </div>
      <div class="panel">
        <h2>By Strategy</h2>
        <div id="strategies"></div>
      </div>
    </div>

    <div class="grid two" style="margin-top:16px;">
      <div class="panel">
        <h2>Open Positions</h2>
        <div id="openTrades"></div>
      </div>
      <div class="panel">
        <h2>Latest Grok Opportunities</h2>
        <div id="opps"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:16px;">
      <h2>Recent Settled Trades</h2>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Trade</th>
              <th>Family</th>
              <th>Conf</th>
              <th>Edge</th>
              <th>Cost</th>
              <th>Result</th>
              <th>P&amp;L</th>
            </tr>
          </thead>
          <tbody id="recentTrades"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const money = n => `$${Number(n || 0).toFixed(2)}`;
    const pct = n => `${Number(n || 0).toFixed(1)}%`;
    const clsPnL = n => Number(n || 0) >= 0 ? 'green' : 'red';

    function stat(label, value, klass = '') {
      return `<div class="panel stat"><div class="label">${label}</div><div class="value ${klass}">${value}</div></div>`;
    }

    function renderRows(id, rows, formatter) {
      const el = document.getElementById(id);
      if (!rows || !rows.length) { el.innerHTML = '<div class="muted">Nothing yet.</div>'; return; }
      el.innerHTML = `<div class="mini-list">${rows.map(formatter).join('')}</div>`;
    }

    fetch('./dashboard_data.json').then(r => r.json()).then(data => {
      document.getElementById('stamp').textContent = `Updated ${new Date(data.generated_at).toLocaleString()}`;

      const acct = data.account || {};
      document.getElementById('stats').innerHTML = [
        stat('Current Balance', money(acct.current_balance), 'blue'),
        stat('Realized P&L', money(acct.realized_pnl), clsPnL(acct.realized_pnl)),
        stat('Return vs Start', pct(acct.return_pct_vs_start), clsPnL(acct.return_pct_vs_start)),
        stat('Win Rate', pct(acct.win_rate), acct.win_rate >= 50 ? 'green' : 'amber'),
        stat('Profit Factor', Number(acct.profit_factor || 0).toFixed(2), (acct.profit_factor || 0) >= 1 ? 'green' : 'red'),
        stat('Open / Settled', `${acct.open_trades || 0} / ${acct.settled_trades || 0}`, 'purple'),
      ].join('');

      const cfg = data.config || {};
      document.getElementById('config').innerHTML = `
        <div class="pill">Min confidence: ${cfg.min_confidence ?? '—'}%</div>
        <div class="pill">Min edge: ${cfg.min_edge_pct ?? '—'}%</div>
        <div class="pill">Max trade: ${money(cfg.max_trade_dollars)}</div>
        <div class="pill">Trades/run: ${cfg.max_live_trades_per_run ?? '—'}</div>
        <div class="pill">Size frac: ${pct((cfg.size_fraction_of_balance || 0) * 100)}</div>
        <div class="pill">Blocked: ${(cfg.hard_blocked_families || []).join(', ') || 'none'}</div>
      `;

      const gpt = data.gpt_review || {};
      document.getElementById('gptReview').innerHTML = `
        <div class="row">
          <div class="row-title ${gpt.status === 'ok' ? 'green' : 'amber'}">${gpt.verdict || gpt.status || 'No review yet'}</div>
          <div class="row-sub">${gpt.thesis || gpt.reason || 'GPT review unavailable.'}</div>
        </div>
        <div class="grid" style="grid-template-columns:1fr 1fr; margin-top:12px; gap:12px;">
          <div class="row"><div class="row-title">Strengths</div><ul>${(gpt.strengths || []).map(x => `<li>${x}</li>`).join('') || '<li>None yet</li>'}</ul></div>
          <div class="row"><div class="row-title">Problems</div><ul>${(gpt.problems || []).map(x => `<li>${x}</li>`).join('') || '<li>None yet</li>'}</ul></div>
        </div>
        <div class="row" style="margin-top:12px;"><div class="row-title">Actions</div><ul>${(gpt.actions || []).map(x => `<li>${x}</li>`).join('') || '<li>No actions yet</li>'}</ul></div>
      `;

      const heuristic = data.heuristic || {};
      document.getElementById('heuristic').innerHTML = `
        <div class="row"><div class="row-title">${heuristic.headline || 'Guardrails'}</div></div>
        <div class="row" style="margin-top:12px;"><ul>${(heuristic.notes || []).map(x => `<li>${x}</li>`).join('') || '<li>Nothing notable.</li>'}</ul></div>
      `;

      const cohortCard = row => `
        <div class="row">
          <div class="row-top"><div class="row-title">${row.name}</div><div class="${Number(row.total_pnl) >= 0 ? 'green' : 'red'}">${money(row.total_pnl)}</div></div>
          <div class="row-sub">${row.settled} settled • ${pct(row.win_rate)} win rate • ${money(row.expectancy)} expectancy</div>
        </div>`;
      renderRows('families', data.families || [], cohortCard);
      renderRows('models', data.models || [], cohortCard);
      renderRows('strategies', data.strategies || [], cohortCard);

      renderRows('openTrades', data.open_positions || [], row => `
        <div class="row">
          <div class="row-top"><div class="row-title">${row.title}</div><div>${row.side?.toUpperCase() || ''}</div></div>
          <div class="row-sub">${money(row.cost_dollars)} at ${money(row.price)} • conf ${row.confidence || 0}% • edge ${Number(row.edge_pct || 0).toFixed(1)}%</div>
        </div>`);

      renderRows('opps', data.latest_opportunities || [], row => `
        <div class="row">
          <div class="row-top"><div class="row-title">${row.title}</div><div class="blue">${row.direction || 'UNCLEAR'}</div></div>
          <div class="row-sub">Fair YES ${pct((row.fair_yes_prob || 0) * 100)} • edge ${pct((row.edge || 0) * 100)} • conf ${row.confidence || 0}%</div>
          <div class="row-sub">${row.reason || row.news_summary || ''}</div>
        </div>`);

      const tbody = document.getElementById('recentTrades');
      const settled = data.recent_settled || [];
      tbody.innerHTML = settled.map(t => `
        <tr>
          <td><strong>${t.title || t.ticker}</strong><div class="muted">${(t.side || '').toUpperCase()} • ${t.signal_source || ''}</div></td>
          <td>${t.family || ''}</td>
          <td>${Number(t.confidence || 0).toFixed(0)}%</td>
          <td>${Number(t.edge_pct || 0).toFixed(1)}%</td>
          <td>${money(t.cost_dollars)}</td>
          <td class="${t.result === 'win' ? 'green' : 'red'}">${t.result}</td>
          <td class="${clsPnL(t.realized_pnl)}">${money(t.realized_pnl)}</td>
        </tr>`).join('');

      const eq = data.equity_curve || [];
      new Chart(document.getElementById('equityChart'), {
        type: 'line',
        data: {
          labels: eq.map(x => x.date),
          datasets: [{
            data: eq.map(x => x.balance),
            borderColor: '#60a5fa',
            backgroundColor: 'rgba(96,165,250,.15)',
            fill: true,
            tension: .25,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#99a6c7' }, grid: { color: 'rgba(38,50,82,.4)' } },
            y: { ticks: { color: '#99a6c7' }, grid: { color: 'rgba(38,50,82,.4)' } }
          }
        }
      });
    }).catch(err => {
      document.getElementById('stamp').textContent = 'Dashboard data failed to load';
      console.error(err);
    });
  </script>
</body>
</html>
